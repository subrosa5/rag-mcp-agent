[project]
name = "rag-agent"
version = "0.2.0"
description = "RAG + multi-agent система без фреймворков: hybrid retrieval, реранкинг, tool-use, MCP"
readme = "README.md"
requires-python = ">=3.12"
# Базовый набор — то, что ставится ВСЕГДА, в том числе на Render.
# Никакого torch/sentence-transformers здесь нарочно нет — см. extra `local`.
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "groq>=1.0",
    # эмбеддинги/реранкинг через Cohere API (USE_COHERE=true)
    "cohere>=5.11",
    # нужен даже без local-бэкенда: оборачиваем cohere-эмбеддинги в ndarray для pgvector
    "numpy>=1.26",
    # lexical search для hybrid retrieval
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Self-hosted эмбеддинги/реранкинг (USE_COHERE=false, дефолт локально).
# На Render это НЕ ставим — торч + веса моделей это ~1.3GB RAM, free tier (512MB) падает с OOM.
local = ["sentence-transformers>=3.0", "torch>=2.4"]
# MCP-транспорт — не нужен на Render (там работает только HTTP api).
mcp = ["mcp>=2.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",   # нужен fastapi.testclient
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
]

# torch в CI (Linux) — CPU-сборка: дефолтная с PyPI тянет CUDA-библиотеки на
# несколько гигабайт, которые на раннере без GPU бесполезны. На macOS
# CPU/MPS-сборка и так дефолтная.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
# E/F/W — базовые ошибки, I — порядок импортов, B — bugbear (частые баги),
# UP — устаревший синтаксис, S — bandit-правила безопасности прямо в линтере.
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",   # длинные строки — комментарии на русском, переносить их ради линтера не стоит
    "B008",   # Depends() в дефолтах аргументов — идиома FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert в тестах — это и есть тесты
"evals/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src/rag_agent"]
ignore_missing_imports = true
# Строгость включаем постепенно: сначала ловим явные ошибки типов, не требуя
# аннотаций везде — иначе первый прогон утонет в сотнях "missing annotation".
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # чтобы тесты могли импортировать evals/
markers = [
    "integration: нужен живой Postgres с pgvector (DATABASE_URL)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/rag_agent"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "web"]
